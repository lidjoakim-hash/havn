name: Havn job pages and health check

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every job page (1)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: havn-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pay reading tests
        run: node pay-core.test.mjs
      - name: Build job pages
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          INDEXNOW_OUT: ${{ runner.temp }}/indexnow.json
        run: node generate.mjs
      - name: Publish changes
        run: |
          git config user.name "havn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- job jobs by en ro artikler remote-jobb hjemmekontor-jobb jobb-pa-engelsk jobb-med-lonn-oppgitt jobb-i-romania remote-jobb-europa "ledige-stillinger-*" "sitemap*.xml" llms.txt llms-full.txt index.html 404.html health.json jobs-sample.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update job pages"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          fi
      - name: Tell IndexNow search engines (Bing, Yandex) about new and removed pages
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/indexnow.json" ] || exit 0
          sleep 90
          node indexnow.mjs "$RUNNER_TEMP/indexnow.json"
      - name: Check NAV import is running
        run: |
          node -e "const h=require('./health.json'); console.log(h); if(!h.ok){console.error('NAV import looks stale or empty. Check Supabase > Edge Functions > nav-import > Logs.'); process.exit(1)}"
